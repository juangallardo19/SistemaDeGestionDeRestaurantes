{% if estado == 'pendiente' %}
<span class="badge bg-warning text-dark"><i class="bi bi-clock me-1"></i>{{ label }}</span>
{% elif estado == 'en_preparacion' %}
<span class="badge bg-info text-dark"><i class="bi bi-fire me-1"></i>{{ label }}</span>
{% elif estado == 'listo' %}
<span class="badge bg-primary"><i class="bi bi-check-circle me-1"></i>{{ label }}</span>
{% elif estado == 'entregado' %}
<span class="badge bg-success"><i class="bi bi-bag-check me-1"></i>{{ label }}</span>
{% elif estado == 'cancelado' %}
<span class="badge bg-danger"><i class="bi bi-x-circle me-1"></i>{{ label }}</span>
{% else %}
<span class="badge bg-secondary">{{ label }}</span>
{% endif %}
