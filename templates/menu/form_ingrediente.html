{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ titulo }} — RestaurApp{% endblock %}

{% block content %}
<div class="container py-2" style="max-width: 580px;">

  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{% url 'menu:lista_ingredientes' %}">Ingredientes</a></li>
      <li class="breadcrumb-item active">{{ titulo }}</li>
    </ol>
  </nav>

  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0"><i class="bi bi-box-seam me-2"></i>{{ titulo }}</h4>
    </div>
    <div class="card-body">
      <form method="POST" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <hr>
        <div class="d-flex gap-2 justify-content-end">
          <a href="{% url 'menu:lista_ingredientes' %}" class="btn btn-outline-secondary">
            <i class="bi bi-x-circle me-1"></i>Cancelar
          </a>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle me-1"></i>
            {% if objeto %}Guardar cambios{% else %}Crear ingrediente{% endif %}
          </button>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
