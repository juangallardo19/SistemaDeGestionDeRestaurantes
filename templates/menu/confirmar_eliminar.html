{% extends 'base.html' %}

{% block title %}Confirmar desactivación — RestaurApp{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 480px;">
  <div class="card shadow border-danger">
    <div class="card-header bg-danger text-white">
      <h5 class="mb-0">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>Confirmar desactivación
      </h5>
    </div>
    <div class="card-body text-center py-5">
      <i class="bi bi-question-circle-fill text-danger" style="font-size: 3.5rem;"></i>
      <p class="mt-3 fs-5">
        ¿Estás seguro que deseas desactivar<br>
        <strong>{{ objeto }}</strong>?
      </p>
      <p class="text-muted small mb-0">
        El registro no será eliminado, solo se marcará como inactivo.
      </p>
    </div>
    <div class="card-footer d-flex gap-2 justify-content-center py-3">
      <a href="{{ cancelar_url }}" class="btn btn-outline-secondary">
        <i class="bi bi-x-circle me-1"></i>Cancelar
      </a>
      <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">
          <i class="bi bi-trash me-1"></i>Sí, desactivar
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
