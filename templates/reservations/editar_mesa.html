{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Editar Mesa {{ mesa.numero }} — RestaurApp{% endblock %}

{% block content %}
<div class="container py-2" style="max-width: 540px;">

  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{% url 'reservations:crud_mesas' %}">Gestión de mesas</a></li>
      <li class="breadcrumb-item active">Editar Mesa {{ mesa.numero }}</li>
    </ol>
  </nav>

  <div class="card shadow-sm">
    <div class="card-header bg-warning text-dark">
      <h4 class="mb-0"><i class="bi bi-pencil me-2"></i>Editar Mesa {{ mesa.numero }}</h4>
    </div>
    <div class="card-body">
      <form method="POST" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <hr>
        <div class="d-flex gap-2 justify-content-end">
          <a href="{% url 'reservations:crud_mesas' %}" class="btn btn-outline-secondary">
            <i class="bi bi-x-circle me-1"></i>Cancelar
          </a>
          <button type="submit" class="btn btn-warning">
            <i class="bi bi-check-circle me-1"></i>Guardar cambios
          </button>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
